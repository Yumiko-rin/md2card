<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md2card · Markdown 一键转分享卡片</title>
<script>
  /* 在样式应用前恢复主题选择，避免闪烁（默认浅色） */
  (function () {
    try {
      var t = localStorage.getItem("md2card:theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) { /* 隐私模式忽略 */ }
  })();
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2322c55e' d='M12 1.5l2.53 7.97L22.5 12l-7.97 2.53L12 22.5l-2.53-7.97L1.5 12l7.97-2.53z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="app.css">
<script src="lib/marked.min.js"></script>
<script src="lib/highlight.min.js"></script>
<script src="lib/html-to-image.min.js"></script>
<script src="renderer.js"></script>
</head>
<body>

<!-- ═══ 顶栏 ═══ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 1.5l2.53 7.97L22.5 12l-7.97 2.53L12 22.5l-2.53-7.97L1.5 12l7.97-2.53z"/></svg>
    </span>
    <span class="brand-name">md2card</span>
    <span class="brand-sub">Markdown 一键转分享卡片</span>
  </div>
  <div class="topbar-actions">
    <button class="theme-toggle" id="btn-theme" title="切换深浅主题" aria-label="切换深浅主题">
      <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <a class="gh-link" href="https://github.com/Yumiko-rin/md2card" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </div>
</header>

<!-- ═══ 工具栏 ═══ -->
<nav class="toolbar" aria-label="卡片设置">
  <div class="toolbar-group" id="theme-chips" role="group" aria-label="主题选择"></div>

  <div class="toolbar-sep"></div>

  <label class="toolbar-item">
    <span>宽度</span>
    <select id="opt-width">
      <option value="360">360px</option>
      <option value="420" selected>420px</option>
      <option value="480">480px</option>
    </select>
  </label>
  <label class="toolbar-item">
    <span>清晰度</span>
    <select id="opt-scale">
      <option value="2" selected>2x 高清</option>
      <option value="3">3x 超清</option>
    </select>
  </label>

  <div class="toolbar-sep"></div>

  <label class="toolbar-item checkbox">
    <input type="checkbox" id="opt-header" checked>
    <span>标题栏</span>
  </label>
  <label class="toolbar-item checkbox">
    <input type="checkbox" id="opt-footer" checked>
    <span>水印</span>
  </label>
  <label class="toolbar-item">
    <span>署名</span>
    <input type="text" id="opt-watermark" value="@Yumiko-rin" maxlength="30" placeholder="你的署名">
  </label>
</nav>

<!-- ═══ 主区域：编辑器 + 预览 ═══ -->
<main class="workspace">
  <section class="editor-pane">
    <div class="pane-label">
      <span>Markdown 源文本</span>
      <span class="pane-actions">
        <button class="btn ghost sm" id="btn-demo" title="载入示例文档">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          示例
        </button>
        <button class="btn ghost sm" id="btn-clear" title="清空编辑器">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          清空
        </button>
      </span>
    </div>
    <label for="editor" class="visually-hidden">Markdown 源文本</label>
    <div class="editor-body">
      <div class="line-numbers" id="line-numbers" aria-hidden="true">1</div>
      <textarea id="editor" spellcheck="false" placeholder="在这里输入 Markdown…"></textarea>
    </div>
    <div class="editor-foot">
      <span id="count-lines">1 行</span>
      <span id="count-chars">0 字</span>
      <span class="foot-hint">Tab 缩进 · 草稿自动保存</span>
    </div>
  </section>

  <section class="preview-pane">
    <div class="pane-label">
      <span>卡片预览（实时）</span>
      <span class="pane-actions">
        <span class="zoom-group" role="group" aria-label="预览缩放">
          <button class="btn ghost sm" id="zoom-out" title="缩小预览" aria-label="缩小预览">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="btn ghost sm" id="zoom-label" title="重置为 100%">100%</button>
          <button class="btn ghost sm" id="zoom-in" title="放大预览" aria-label="放大预览">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </span>
        <button class="btn ghost sm" id="btn-copy" title="复制到剪贴板">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制图片
        </button>
        <button class="btn primary sm" id="btn-download" title="导出 PNG（Ctrl+S）">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载 PNG
        </button>
      </span>
    </div>
    <div class="stage" id="stage">
      <div class="mdc-card" id="card">
        <div class="mdc-topbar"></div>
        <div class="mdc-inner">
          <header class="mdc-header" hidden>
            <h1 class="mdc-title"></h1>
            <div class="mdc-date"></div>
          </header>
          <div class="mdc-body"></div>
          <footer class="mdc-footer" hidden>
            <span class="mdc-watermark"></span>
            <span class="mdc-brand">md2card</span>
          </footer>
        </div>
      </div>
      <div class="stage-empty" id="stage-empty" hidden>
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>在左侧输入 Markdown<br>卡片会实时出现在这里</p>
      </div>
    </div>
  </section>
</main>

<div id="toast-container" aria-live="polite"></div>

<footer class="statusbar">
  <span id="status-info">就绪</span>
  <span class="status-hint">数据仅保存在浏览器本地 · 支持 GFM / 代码高亮 / 任务列表 / 表格</span>
</footer>

<script src="app.js"></script>
</body>
</html>
